<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Contact PizzaDelivery">
        <title>Contact - PizzaDelivery</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="base.css">
        <link rel="stylesheet" href="contact.css">
    </head>
<body>
    <!-- Shared header: built by script.js -->
    <site-header></site-header>

    <main class="contact-page">
        <h1 class="page-title page-title--no-divider">Contact us</h1>

        <div class="page-columns">
            <!-- Left column: the contact form -->
            <form class="form card contact-form" id="contact-form">
                <label for="contact-name">Full Name</label>
                <input type="text" id="contact-name" name="name" placeholder="Your name" required>

                <label for="contact-email">Email</label>
                <input type="email" id="contact-email" name="email" placeholder="you@example.com" required>

                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" placeholder="How can we help?" required></textarea>

                <button type="submit" class="button button--primary">Submit</button>
            </form>

            <!-- Right column: contact information -->
            <aside class="card contact-info">
                <h2 class="card-title">Contact information</h2>
                <address class="contact-details">
                    <p>Phone: <a href="tel:02079460123">020 7946 0123</a></p>
                    <p>Email: <a href="mailto:hello@pizzadelivery.example">hello@pizzadelivery.example</a></p>
                    <p>Address: 1 Example Street, London</p>
                </address>
            </aside>
        </div>
    </main>

    <!-- Shared footer: built by script.js -->
    <site-footer></site-footer>

    <!--This connects to the JavaScript file.-->
    <script src="script.js"></script>
</body>
</html>
